[pytest]
# ═══════════════════════════════════════════════════════════════
# pytest configuration — Digital FTE Backend
# ═══════════════════════════════════════════════════════════════

# Use auto mode so async test functions don't need @pytest.mark.asyncio
asyncio_mode = auto

# Look for tests here
testpaths = tests

# Show verbose output with short tracebacks
addopts = -v --tb=short

# Patterns to ignore
python_files = test_*.py
python_classes = Test*
python_functions = test_*
